<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">

<title>管卡 — 信用卡管理工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='18' rx='3' fill='none' stroke='%23E8B04B' stroke-width='2.5'/%3E%3Cline x1='6' y1='13' x2='26' y2='13' stroke='%23E8B04B' stroke-width='2.5'/%3E%3Cline x1='6' y1='19' x2='14' y2='19' stroke='%23E8B04B' stroke-width='2.5'/%3E%3C/svg%3E">

<body>
<header class="topbar">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="3" y="7" width="26" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <line x1="6" y1="13" x2="26" y2="13" stroke="currentColor" stroke-width="2.5"/>
      <line x1="6" y1="19" x2="14" y2="19" stroke="currentColor" stroke-width="2.5"/>
    </svg>
    <span class="brand-name">管卡</span>
    <span class="brand-sub">信用卡管理工具</span>
  </div>
  <nav class="nav">
    <a href="#" class="nav-item active" data-page="mycards">我的持卡</a>

    <a href="#" class="nav-item" data-page="vouchers">卡/票</a>

  </nav>
  <button class="theme-toggle" id="btn-notify" title="提醒设置">
    <span>🔔</span>
  </button>
  <button class="theme-toggle" id="theme-toggle" title="切换主题">
    <span id="theme-icon">🌙</span>
  </button>
  <button class="theme-toggle" id="btn-logout" title="退出登录" style="display:none">

<main id="app" class="app"></main>
<div id="drawer-root"></div>

<script src="/app.js"></script>

</html>
